<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Evolving Plugin System</title>
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "@websim/use-query": "https://esm.websim.com/@websim/use-query"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .plugin-patch {
            animation: slideIn 0.5s ease-out;
            border-left: 4px solid #3b82f6;
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .processing {
            animation: pulse 2s infinite;
        }
        .error-flash {
            animation: errorFlash 0.5s ease-out;
        }
        @keyframes errorFlash {
            0% { background-color: #fef2f2; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Metadata Comments for Plugin Generation -->
    <!-- 
    COMMENT: Add a dark mode toggle button
    USER: testuser1
    TIMESTAMP: 2024-01-01T12:00:00Z
    -->
    
    <!-- 
    COMMENT: Create a particle animation background
    USER: designer_bob
    TIMESTAMP: 2024-01-01T12:05:00Z
    -->
    
    <!-- 
    COMMENT: Add a real-time visitor counter
    USER: dev_sarah
    TIMESTAMP: 2024-01-01T12:10:00Z
    -->

    <!-- 
    COMMENT: Make the buttons glow when hovered
    USER: testuser1
    TIMESTAMP: 2024-01-01T12:15:00Z
    -->

    <!-- 
    COMMENT: Add a confetti effect when plugins load
    USER: testuser1
    TIMESTAMP: 2024-01-01T12:20:00Z
    -->

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { WebsimSocket, useQuery } from '@websim/use-query';

        // Database setup
        const room = new WebsimSocket({
            schema: {
                plugin: {
                    id: "uuid",
                    comment_text: "text",
                    plugin_json: "jsonb",
                    status: "text", // 'processing', 'active', 'error'
                    error_message: "text",
                    applied_at: "timestamptz",
                    comment_user: "text",
                    retry_count: "integer"
                },
                page_state: {
                    id: "uuid",
                    current_plugins: "jsonb",
                    last_comment_check: "timestamptz"
                }
            }
        });

        // Plugin system
        class PluginSystem {
            constructor() {
                this.activePlugins = [];
                this.sandboxContainer = null;
            }

            async applyPlugin(pluginData) {
                try {
                    // Validate plugin structure
                    if (!pluginData.id || !pluginData.type || !pluginData.content) {
                        throw new Error('Invalid plugin structure');
                    }

                    // Sandbox test first
                    await this.sandboxTest(pluginData);

                    // Apply to actual page
                    switch (pluginData.type) {
                        case 'css':
                            this.applyCSSPlugin(pluginData);
                            break;
                        case 'component':
                            this.applyComponentPlugin(pluginData);
                            break;
                        case 'script':
                            this.applyScriptPlugin(pluginData);
                            break;
                        default:
                            throw new Error(`Unknown plugin type: ${pluginData.type}`);
                    }

                    this.activePlugins.push(pluginData);
                    return true;
                } catch (error) {
                    console.error('Plugin application failed:', error);
                    throw error;
                }
            }

            async sandboxTest(pluginData) {
                return new Promise((resolve, reject) => {
                    try {
                        // Create sandboxed iframe for testing
                        const iframe = document.createElement('iframe');
                        iframe.style.display = 'none';
                        iframe.sandbox = 'allow-scripts';
                        
                        iframe.onload = () => {
                            try {
                                // Test plugin in sandbox
                                const testDoc = iframe.contentDocument;
                                
                                if (pluginData.type === 'css') {
                                    const style = testDoc.createElement('style');
                                    style.textContent = pluginData.content.css;
                                    testDoc.head.appendChild(style);
                                } else if (pluginData.type === 'script') {
                                    const script = testDoc.createElement('script');
                                    script.textContent = pluginData.content.javascript;
                                    testDoc.head.appendChild(script);
                                }
                                
                                // If we get here, plugin is safe
                                document.body.removeChild(iframe);
                                resolve();
                            } catch (sandboxError) {
                                document.body.removeChild(iframe);
                                reject(new Error(`Sandbox test failed: ${sandboxError.message}`));
                            }
                        };

                        iframe.src = 'about:blank';
                        document.body.appendChild(iframe);
                    } catch (error) {
                        reject(error);
                    }
                });
            }

            applyCSSPlugin(pluginData) {
                const style = document.createElement('style');
                style.id = `plugin-${pluginData.id}`;
                style.textContent = pluginData.content.css;
                document.head.appendChild(style);
            }

            applyComponentPlugin(pluginData) {
                // Create container for component
                const container = document.createElement('div');
                container.id = `plugin-component-${pluginData.id}`;
                container.className = 'plugin-component';
                container.innerHTML = pluginData.content.html;
                
                // Add to designated plugin area
                const pluginArea = document.getElementById('plugin-area');
                if (pluginArea) {
                    pluginArea.appendChild(container);
                }
            }

            applyScriptPlugin(pluginData) {
                const script = document.createElement('script');
                script.id = `plugin-script-${pluginData.id}`;
                script.textContent = pluginData.content.javascript;
                document.head.appendChild(script);
            }
        }

        const pluginSystem = new PluginSystem();

        // Function to generate and apply plugin
        async function generateAndApplyPlugin(comment) {
            let processingEntry = null;
            try {
                // Create processing entry
                processingEntry = await room.collection('plugin').upsert({
                    comment_text: comment.text,
                    comment_user: comment.user,
                    status: 'processing',
                    retry_count: 0
                });

                console.log('Processing comment:', comment.text, 'for user:', comment.user);

                // Generate plugin using LLM
                const pluginJson = await generatePluginWithLLM(comment.text);
                
                console.log('Generated plugin:', pluginJson);
                
                // Validate and sandbox test
                await pluginSystem.sandboxTest(pluginJson);

                // Update database with successful plugin
                await room.collection('plugin').upsert({
                    id: processingEntry.id,
                    plugin_json: pluginJson,
                    status: 'active',
                    applied_at: new Date().toISOString()
                });

                // Apply to page
                await pluginSystem.applyPlugin(pluginJson);

                console.log('Plugin applied successfully:', pluginJson.name);

            } catch (error) {
                console.error('Plugin generation failed:', error);
                
                // Update database with error only if we have a processing entry
                if (processingEntry && processingEntry.id) {
                    try {
                        await room.collection('plugin').upsert({
                            id: processingEntry.id,
                            status: 'error',
                            error_message: error.message,
                            retry_count: (processingEntry.retry_count || 0) + 1
                        });

                        // Retry with error feedback if under retry limit
                        if ((processingEntry.retry_count || 0) < 2) {
                            setTimeout(() => retryPluginGeneration(processingEntry.id, comment, error.message), 5000);
                        }
                    } catch (dbError) {
                        console.error('Failed to update error status:', dbError);
                    }
                } else {
                    console.error('No processing entry to update with error');
                }
            }
        }

        // Comment processor
        async function processMetadataComments() {
            try {
                const currentUser = await window.websim.getCurrentUser();
                if (!currentUser) {
                    console.log('No current user found');
                    return;
                }

                console.log('Current user:', currentUser.username);

                // Extract comments from HTML
                const htmlContent = document.documentElement.outerHTML;
                const commentRegex = /<!--\s*COMMENT:\s*(.*?)\s*USER:\s*(.*?)\s*TIMESTAMP:\s*(.*?)\s*-->/gs;
                const comments = [];
                let match;

                while ((match = commentRegex.exec(htmlContent)) !== null) {
                    comments.push({
                        text: match[1].trim(),
                        user: match[2].trim(),
                        timestamp: match[3].trim()
                    });
                }

                console.log('Found comments:', comments);

                // Process comments from current user that haven't been processed
                const existingPlugins = await room.collection('plugin').getList();
                console.log('Existing plugins:', existingPlugins);
                
                for (const comment of comments) {
                    console.log('Checking comment:', comment.text, 'by user:', comment.user);
                    if (comment.user === currentUser.username) {
                        const alreadyProcessed = existingPlugins.some(p => 
                            p.comment_text === comment.text && p.comment_user === comment.user
                        );

                        console.log('Already processed?', alreadyProcessed);

                        if (!alreadyProcessed) {
                            console.log('Processing new comment:', comment.text);
                            await generateAndApplyPlugin(comment);
                        }
                    }
                }
            } catch (error) {
                console.error('Error in processMetadataComments:', error);
            }
        }

        // Function to generate plugin using LLM
        async function generatePluginWithLLM(commentText) {
            const systemPrompt = `You are a plugin generator for a self-evolving webpage. Generate a valid JSON plugin based on the user's comment.

Plugin structure:
{
  "id": "unique-id",
  "type": "css|component|script",
  "name": "descriptive name",
  "description": "what this plugin does",
  "content": {
    "css": "CSS code (if type is css)",
    "html": "HTML code (if type is component)", 
    "javascript": "JS code (if type is script)"
  }
}

Rules:
- Always include an id, type, name, description, and content
- CSS should be scoped to avoid conflicts
- Components should be self-contained
- Scripts should be safe and non-destructive
- Respond ONLY with valid JSON, no other text`;

            const completion = await websim.chat.completions.create({
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: `Create a plugin for: ${commentText}` }
                ],
                json: true
            });

            return JSON.parse(completion.content);
        }

        // Function to retry plugin generation
        async function retryPluginGeneration(pluginId, comment, previousError) {
            try {
                const retryPrompt = `Previous attempt failed with error: ${previousError}. Please fix and try again: ${comment.text}`;
                const pluginJson = await generatePluginWithLLM(retryPrompt);
                
                await pluginSystem.sandboxTest(pluginJson);

                await room.collection('plugin').upsert({
                    id: pluginId,
                    plugin_json: pluginJson,
                    status: 'active',
                    applied_at: new Date().toISOString()
                });

                await pluginSystem.applyPlugin(pluginJson);
            } catch (error) {
                await room.collection('plugin').upsert({
                    id: pluginId,
                    status: 'error',
                    error_message: `Retry failed: ${error.message}`
                });
            }
        }

        // Main App Component
        function App() {
            const {data: plugins, loading} = useQuery(room.collection('plugin'));
            const [isProcessing, setIsProcessing] = useState(false);
            const [processingComments, setProcessingComments] = useState([]);

            // Load existing plugins on mount
            useEffect(() => {
                if (plugins) {
                    plugins.forEach(plugin => {
                        if (plugin.status === 'active' && plugin.plugin_json) {
                            pluginSystem.applyPlugin(plugin.plugin_json).catch(console.error);
                        }
                    });
                }
            }, [plugins]);

            // Check for new comments periodically
            useEffect(() => {
                const interval = setInterval(async () => {
                    console.log('Checking for new comments...');
                    setIsProcessing(true);
                    try {
                        await processMetadataComments();
                    } catch (error) {
                        console.error('Error checking comments:', error);
                    } finally {
                        setIsProcessing(false);
                    }
                }, 10000);

                // Initial check
                console.log('Initial comment check...');
                processMetadataComments();

                return () => clearInterval(interval);
            }, []);

            const activePlugins = plugins?.filter(p => p.status === 'active') || [];
            const processingPlugins = plugins?.filter(p => p.status === 'processing') || [];
            const errorPlugins = plugins?.filter(p => p.status === 'error') || [];

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
                    <div className="container mx-auto px-4 py-8">
                        <header className="text-center mb-12">
                            <h1 className="text-4xl font-bold text-gray-800 mb-4">
                                Self-Evolving Plugin System
                            </h1>
                            <p className="text-lg text-gray-600 mb-4">
                                Add any comment to the HTML metadata - the AI will interpret it and create a plugin automatically
                            </p>
                            <div className={`inline-flex items-center space-x-2 px-4 py-2 rounded-full ${isProcessing ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'}`}>
                                <div className={`w-2 h-2 rounded-full ${isProcessing ? 'bg-yellow-500 processing' : 'bg-green-500'}`}></div>
                                <span>{isProcessing ? 'Scanning for new comments...' : 'Monitoring for changes'}</span>
                            </div>
                        </header>

                        {/* Processing Comments Indicator */}
                        {processingPlugins.length > 0 && (
                            <div className="mb-6 bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-lg">
                                <div className="flex items-center">
                                    <div className="w-3 h-3 bg-yellow-400 rounded-full processing mr-3"></div>
                                    <h3 className="text-lg font-semibold text-yellow-800">
                                        Processing Comments into Plugins...
                                    </h3>
                                </div>
                                <div className="mt-3 space-y-2">
                                    {processingPlugins.map(plugin => (
                                        <div key={plugin.id} className="bg-white p-3 rounded border-l-2 border-yellow-300">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <p className="font-medium text-gray-800">"{plugin.comment_text}"</p>
                                                    <p className="text-sm text-gray-600">AI is interpreting this comment and generating a plugin...</p>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-sm font-medium text-yellow-600">@{plugin.comment_user}</span>
                                                    <div className="flex items-center mt-1">
                                                        <div className="animate-spin rounded-full h-4 w-4 border-b-2 border-yellow-600"></div>
                                                        <span className="ml-2 text-xs text-gray-500">Processing...</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="grid md:grid-cols-2 gap-8 mb-8">
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h2 className="text-2xl font-semibold mb-4 text-gray-800">Active Plugins</h2>
                                <div className="space-y-3">
                                    {activePlugins.map(plugin => (
                                        <div key={plugin.id} className="plugin-patch bg-blue-50 p-4 rounded-lg">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <h3 className="font-semibold text-gray-800">
                                                        {plugin.plugin_json?.name || 'Unnamed Plugin'}
                                                    </h3>
                                                    <p className="text-sm text-gray-600">
                                                        {plugin.plugin_json?.description || plugin.comment_text}
                                                    </p>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-sm font-medium text-blue-600">
                                                        @{plugin.comment_user}
                                                    </div>
                                                    <div className="text-xs text-gray-500">
                                                        {new Date(plugin.applied_at).toLocaleTimeString()}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {activePlugins.length === 0 && (
                                        <p className="text-gray-500 italic">No active plugins yet</p>
                                    )}
                                </div>
                            </div>

                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h2 className="text-2xl font-semibold mb-4 text-gray-800">System Status</h2>
                                
                                {errorPlugins.length > 0 && (
                                    <div className="mb-4">
                                        <h3 className="font-semibold text-red-600 mb-2">Failed Interpretations</h3>
                                        {errorPlugins.map(plugin => (
                                            <div key={plugin.id} className="bg-red-50 p-3 rounded error-flash">
                                                <p className="text-sm font-medium">"{plugin.comment_text}"</p>
                                                <p className="text-xs text-red-600 mt-1">{plugin.error_message}</p>
                                                <p className="text-xs text-gray-500">by @{plugin.comment_user}</p>
                                                {(plugin.retry_count || 0) < 2 && (
                                                    <p className="text-xs text-blue-600 mt-1">Retrying interpretation...</p>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="bg-gray-50 p-4 rounded-lg">
                                    <h3 className="font-semibold text-gray-700 mb-2">How it works</h3>
                                    <ol className="text-sm text-gray-600 space-y-1">
                                        <li>1. Add HTML comments with any text describing what you want</li>
                                        <li>2. AI automatically interprets your comment into a plugin idea</li>
                                        <li>3. System generates plugin JSON from your request</li>
                                        <li>4. Plugin is sandboxed and tested for safety</li>
                                        <li>5. If safe, plugin is applied to evolve the page</li>
                                    </ol>
                                    <p className="text-xs text-gray-500 mt-2">
                                        Examples: "dark mode", "add animations", "visitor counter", "make buttons sparkle"
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Plugin rendering area */}
                        <div id="plugin-area" className="bg-white rounded-lg shadow-lg p-6">
                            <h2 className="text-2xl font-semibold mb-4 text-gray-800">Dynamic Plugin Content</h2>
                            <p className="text-gray-600 mb-4">
                                Plugin-generated content will appear here as they are processed and applied.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
